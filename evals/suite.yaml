      expect: { opted_out: true, reply_matches: 'opted out' }
    - user: Looking for a 3 bedroom condo in Lantern Hill under $700k within 30 days.
      expect: { opted_out: true, qualified: false }
    - user: START
      expect: { opted_out: false }

- id: web-stop-is-not-opt-out
  channel: web
  turns:
