- id: drip-web-book
  channel: web
  turns:
    - user: Hi, I want to buy a place
      expect: { stage: collecting, booked: false }
    - user: a condo
      expect: { slots: { propertyType: condo } }
    - user: 3 bedrooms
      expect: { slots: { beds: 3 } }
    - user: Lantern Hill
      expect: { slots: { area: Lantern Hill } }
    - user: budget 700k
      expect: { slots: { budgetMax: 700000 } }
    - user: within 30 days
      expect: { qualified: true, listings_min: 2, score_min: 80 }
    - user: Book the earliest slot
      expect: { booked: true, reply_matches: booked }
  expect: { min_replies: 7, booked: true }

- id: one-shot-then-book
  channel: web
  turns:
    - user: Looking for a 3 bedroom condo in Lantern Hill under $700k within 30 days.
      expect: { qualified: true, listings_min: 2, listings_max: 3 }
    - user: Book the earliest slot
      expect: { booked: true }
  expect: { min_replies: 2 }

- id: budget-range
  channel: web
  turns:
    - user: 3 bedroom condo in Glassmarket, budget between 400k and 550k, just looking
      expect:
        qualified: true
        slots: { budgetMin: 400000, budgetMax: 550000, timeline: browsing, area: Glassmarket }

- id: word-number-beds
  channel: web
  turns:
    - user: three bedroom townhouse in Old Keel under 600k, just looking
      expect: { slots: { beds: 3, propertyType: townhouse, area: Old Keel }, listings_min: 2 }

- id: timeline-asap
  channel: web
  turns:
    - user: 3 bedroom condo in Lantern Hill under $700k as soon as possible
      expect: { slots: { timeline: asap }, score_min: 100 }

- id: timeline-browsing
  channel: web
  turns:
    - user: 2 bedroom condo in Glassmarket around 500k, just looking
      expect: { qualified: true, slots: { timeline: browsing }, listings_min: 1 }

- id: townhouse-old-keel
  channel: web
  turns:
    - user: 3 bedroom townhouse in Old Keel under 600k within 90 days
      expect: { qualified: true, listings_min: 2, slots: { timeline: 90_days } }

- id: single-family-north-wharf
  channel: web
