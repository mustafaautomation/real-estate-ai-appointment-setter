- id: change-area
  channel: web
  turns:
    - user: 3 bedroom condo in Lantern Hill under $700k within 30 days
    - user: somewhere else
      expect: { slots: { area: null }, qualified: false }
    - user: Old Keel and make it a townhouse
      expect: { slots: { area: Old Keel, propertyType: townhouse } }

- id: change-beds
  channel: web
  turns:
    - user: 3 bedrooms
      expect: { slots: { beds: 3 } }
    - user: actually 4 bedrooms
      expect: { slots: { beds: 4 } }

- id: change-type
  channel: web
  turns:
    - user: a condo
    - user: make it a townhouse
      expect: { slots: { propertyType: townhouse } }

- id: objection-price
  channel: web
  turns:
